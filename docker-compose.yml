services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: localdev
    volumes:
      - arena-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
  nakama:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        /nakama/nakama migrate up --database.address nakama:localdev@postgres:5432/nakama &&
        exec /nakama/nakama --name arena --database.address nakama:localdev@postgres:5432/nakama
        --socket.server_key defaultkey --console.username admin --console.password localdevpassword
        --logger.level INFO --session.token_expiry_sec 7200
    ports:
      - "7350:7350"
      - "127.0.0.1:7351:7351"
volumes:
  arena-db:
